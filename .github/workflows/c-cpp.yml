name: C/C++ CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      qualification:
        description: Full acceptance or focused unlit-interpolation diagnosis
        type: choice
        options: [full, numeric]
        default: full
permissions:
  contents: read
jobs:
  macos-build:
    if: github.event.inputs.qualification != 'numeric'
    name: macOS arm64 builds and CPU/service/managed subset
    # The explicit preview image runs macOS 27; macos-latest currently runs 26.
    # Hosted VM checks do not qualify physical Apple OpenGL or desktop interaction.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          key: hazel-macos27-arm64-${{ hashFiles('scripts/dependencies/**', 'scripts/internal/toolchain.json') }}
      - name: Native host/toolchain contracts
        run: |
          python3 tests/macos/sdk_workflow.py
          python3 scripts/hazel.py diagnose
      - name: Prepare and build Debug with pinned checkout-owned inputs
        run: python3 scripts/hazel.py setup --config Debug --tests
      - name: Debug CPU/service/managed subset (no GPU claim)
        run: python3 scripts/hazel.py test --config Debug --suite cpu
      - name: Build Release
        run: python3 scripts/hazel.py build --config Release --tests
      - name: Release CPU/service/managed subset (no GPU claim)
        run: python3 scripts/hazel.py test --config Release --suite cpu
      - name: Preserve qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-testing-evidence
          path: build/testing/logs/
  windows-build:
    if: github.event.inputs.qualification != 'numeric'
    name: Windows Debug, Release and extracted binaries
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache pinned project-owned dependencies
        uses: actions/cache/restore@v4
        id: shader-cache
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          restore-keys: nutella-windows2022-
          key: nutella-windows2022-${{ hashFiles('scripts/dependencies/build-shader-tools.py', 'scripts/dependencies/shader-workspace.lua', 'scripts/dependencies/generate-shader-inputs.py', 'scripts/dependencies/shader-sources.json', 'scripts/dependencies/shader-tools.json', 'scripts/dependencies/shader-tools-compat.h', 'scripts/internal/toolchain.json') }}
      - name: Setup and build Debug (two jobs)
        run: ./scripts/setup.ps1 --tests
      - name: Windows fast Debug CPU/policy feedback before Release and packaging
        run: python scripts/hazel.py test --config Debug --suite cpu
      - name: Windows remaining Debug graphics, authoring and runtime regressions
        run: python scripts/hazel.py test --config Debug --profile software --suite graphics
      - name: Build Release (two jobs, after Debug)
        run: python scripts/hazel.py build --config Release --tests
      - name: Cache completed pinned SDKs independently of application tests
        if: always() && steps.shader-cache.outputs.cache-hit != 'true' && hashFiles('build/dependencies/install/Debug-windows-x86_64/shader-tools.json') != '' && hashFiles('build/dependencies/install/Release-windows-x86_64/shader-tools.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}
      - name: Build all five example script modules in Debug and Release
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            foreach ($game in @('MeadowRun', 'Skybound', 'LastLightkeeper', 'SceneTransitions', 'Sandbox')) {
              python scripts/hazel.py script-build "examples/$game/$game.hproj" --config $configuration
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Construct complete Release distributions
        run: python scripts/hazel.py package
      - name: Test extracted archives with source resources and SDK unavailable
        run: python scripts/hazel.py test-packages --profile software
      - name: Verify packaged OpenGL 4.1 path
        run: python scripts/hazel.py test-packages --profile gl41
      - name: Windows Release regressions
        run: python scripts/hazel.py test --config Release --profile software
      - name: Windows Release OpenGL 4.1 and tutorial authoring
        env:
          HAZEL_FINAL_UI_PROJECT: ${{ github.workspace }}/examples/Sandbox/Sandbox.hproj
        run: python scripts/hazel.py test --config Release --profile gl41
      - name: Windows authored game workflows and gameplay invariants
        run: |
          python scripts/hazel.py test-games --config Debug --profile software
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/hazel.py test-games --config Release --profile software
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Construct complete Windows game archives
        run: |
          foreach ($game in @('MeadowRun', 'Skybound', 'LastLightkeeper', 'SceneTransitions', 'Sandbox')) {
            python scripts/hazel.py package --app Nutella --project "examples/$game/$game.hproj" --name $game --output dist/games
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows extracted game acceptance
        run: |
          python scripts/hazel.py test-games --config Release --packages --profile software
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/hazel.py test-games --config Release --packages --profile gl41
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload qualified Windows application archives
        uses: actions/upload-artifact@v4
        with:
          name: Hazel-Windows-x64-Release-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Upload all five qualified example archives
        uses: actions/upload-artifact@v4
        with:
          name: Hazel-Examples-Windows-x64-Release-${{ github.sha }}
          path: dist/games/*.zip*
          if-no-files-found: error
      - name: Preserve separate testing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-testing-evidence
          path: |
            build/testing/logs/
            build/testing/packages/
            build/testing/games/
            build/testing/windows-mesa/readme*
            build/testing/windows-mesa/license*
            bin/Debug-windows-x86_64/MigrationExampleGamesSmoke/*.exe
            bin/Debug-windows-x86_64/MigrationExampleGamesSmoke/*.pdb
          if-no-files-found: ignore
  linux-build:
    if: github.event.inputs.qualification != 'numeric'
    name: Linux Debug, Release and extracted binaries (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install explicit CI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip pkg-config mono-devel uuid-dev libgtk-3-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libxtst6 xvfb xauth
      - name: Cache pinned project-owned dependencies
        uses: actions/cache/restore@v4
        id: shader-cache
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          restore-keys: nutella-ubuntu24-gcc13-
          key: nutella-ubuntu24-gcc13-${{ hashFiles('scripts/dependencies/build-shader-tools.py', 'scripts/dependencies/shader-workspace.lua', 'scripts/dependencies/generate-shader-inputs.py', 'scripts/dependencies/shader-sources.json', 'scripts/dependencies/shader-tools.json', 'scripts/dependencies/shader-tools-compat.h', 'scripts/internal/toolchain.json') }}
      - name: Setup and build Debug (two jobs)
        run: scripts/setup.sh --tests
      - name: Linux fast Debug CPU/policy feedback before Release and packaging
        run: python3 scripts/hazel.py test --config Debug --suite cpu
      - name: Linux remaining Debug graphics regressions
        run: xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test --config Debug --profile software --suite graphics
      - name: Build Release (two jobs, after Debug)
        run: python3 scripts/hazel.py build --config Release --tests
      - name: Cache completed pinned SDKs independently of application tests
        if: always() && steps.shader-cache.outputs.cache-hit != 'true' && hashFiles('build/dependencies/install/Debug-linux-x86_64/shader-tools.json') != '' && hashFiles('build/dependencies/install/Release-linux-x86_64/shader-tools.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}
      - name: Build all five example script modules in Debug and Release
        run: |
          for configuration in Debug Release; do
            for game in MeadowRun Skybound LastLightkeeper SceneTransitions Sandbox; do
              python3 scripts/hazel.py script-build "examples/$game/$game.hproj" --config "$configuration"
            done
          done
      - name: Linux Release regressions
        run: xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test --config Release --profile software
      - name: Linux Release OpenGL 4.1 and tutorial authoring
        env:
          HAZEL_FINAL_UI_PROJECT: ${{ github.workspace }}/examples/Sandbox/Sandbox.hproj
        run: xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test --config Release --profile gl41
      - name: Construct complete Release distributions
        run: python3 scripts/hazel.py package
      - name: Test extracted archives with source resources and SDK unavailable
        run: xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test-packages --profile software
      - name: Verify packaged OpenGL 4.1 path
        run: xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test-packages --profile gl41
      - name: Linux authored game workflows and gameplay invariants
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test-games --config Debug --profile software
          xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test-games --config Release --profile software
      - name: Construct complete Linux game archives
        run: |
          for game in MeadowRun Skybound LastLightkeeper SceneTransitions Sandbox; do
            python3 scripts/hazel.py package --app Nutella --project "examples/$game/$game.hproj" --name "$game" --output dist/games
          done
      - name: Linux extracted game acceptance
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test-games --config Release --packages --profile software
          xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test-games --config Release --packages --profile gl41
      - name: Upload qualified Linux application archives
        uses: actions/upload-artifact@v4
        with:
          name: Hazel-Linux-x86_64-Release-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Upload all five qualified example archives
        uses: actions/upload-artifact@v4
        with:
          name: Hazel-Examples-Linux-x86_64-Release-${{ github.sha }}
          path: dist/games/*.tar.gz*
          if-no-files-found: error
      - name: Preserve separate testing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-testing-evidence
          path: |
            build/testing/logs/
            build/testing/packages/
            build/testing/games/
          if-no-files-found: ignore

  windows-numeric:
    if: github.event.inputs.qualification == 'numeric'
    name: windows focused unlit HDR diagnosis
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Cache pinned project-owned dependencies
      uses: actions/cache/restore@v4
      id: shader-cache
      with:
        path: |
          build/dependencies/install
          build/tools/premake-core
        restore-keys: nutella-windows2022-
        key: nutella-windows2022-${{ hashFiles('scripts/dependencies/build-shader-tools.py', 'scripts/dependencies/shader-workspace.lua', 'scripts/dependencies/generate-shader-inputs.py', 'scripts/dependencies/shader-sources.json', 'scripts/dependencies/shader-tools.json', 'scripts/dependencies/shader-tools-compat.h', 'scripts/internal/toolchain.json') }}
    - name: Affected Debug targets only
      run: python scripts/hazel.py build --config Debug --tests --target MigrationRenderer2DSmoke --target HazelProject --target MigrationManagedFixture --target Hazel-ScriptCore
    - name: Independent production and GLSL 410 interpolation probes
      env:
        HAZEL_UNLIT_INTERPOLATION_PROBE: '1'
      run: |-
        python scripts/hazel.py test --config Debug --only Renderer2DSmoke --profile software
        $software = $LASTEXITCODE
        python scripts/hazel.py test --config Debug --only Renderer2DSmoke --profile gl41
        exit ([Math]::Max($software, $LASTEXITCODE))
    - name: Retain numeric diagnostics including failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-numeric-evidence
        path: build/testing/logs/

  linux-numeric:
    if: github.event.inputs.qualification == 'numeric'
    name: linux focused unlit HDR diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install explicit CI prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3 python3-pip pkg-config mono-devel uuid-dev libgtk-3-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libxtst6 xvfb xauth
    - name: Cache pinned project-owned dependencies
      uses: actions/cache/restore@v4
      id: shader-cache
      with:
        path: |
          build/dependencies/install
          build/tools/premake-core
        restore-keys: nutella-ubuntu24-gcc13-
        key: nutella-ubuntu24-gcc13-${{ hashFiles('scripts/dependencies/build-shader-tools.py', 'scripts/dependencies/shader-workspace.lua', 'scripts/dependencies/generate-shader-inputs.py', 'scripts/dependencies/shader-sources.json', 'scripts/dependencies/shader-tools.json', 'scripts/dependencies/shader-tools-compat.h', 'scripts/internal/toolchain.json') }}
    - name: Affected Debug targets only
      run: python3 scripts/hazel.py build --config Debug --tests --target MigrationRenderer2DSmoke --target HazelProject --target MigrationManagedFixture --target Hazel-ScriptCore
    - name: Independent production and GLSL 410 interpolation probes
      env:
        HAZEL_UNLIT_INTERPOLATION_PROBE: '1'
      run: |-
        set +e
        xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test --config Debug --only Renderer2DSmoke --profile software
        software=$?
        xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test --config Debug --only Renderer2DSmoke --profile gl41
        gl41=$?
        test "$software" -eq 0 -a "$gl41" -eq 0
    - name: Retain numeric diagnostics including failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-numeric-evidence
        path: build/testing/logs/
