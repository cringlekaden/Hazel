name: C/C++ CI
on:
  push:
    branches: [master, 'migration/**', 'fix/authoring-reliability', 'feature/nutella-runtime', 'feature/example-games', 'feature/editor-authoring', 'feature/sprite-sheet-authoring']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    name: Windows Debug, Release and extracted binaries
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache pinned project-owned dependencies
        uses: actions/cache/restore@v4
        id: shader-cache
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          restore-keys: nutella-windows2022-
          key: nutella-windows2022-${{ hashFiles('scripts/dependencies/build-shader-tools.py', 'scripts/dependencies/shader-workspace.lua', 'scripts/dependencies/generate-shader-inputs.py', 'scripts/dependencies/shader-sources.json', 'scripts/dependencies/shader-tools.json', 'scripts/dependencies/shader-tools-compat.h', 'scripts/internal/toolchain.json') }}
      - name: Setup and build Debug (two jobs)
        run: ./scripts/setup.ps1 --tests
      - name: Build Release (two jobs, after Debug)
        run: python scripts/hazel.py build --config Release --tests
      - name: Cache completed pinned SDKs independently of application tests
        if: always() && steps.shader-cache.outputs.cache-hit != 'true' && hashFiles('build/dependencies/install/Debug-windows-x86_64/shader-tools.json') != '' && hashFiles('build/dependencies/install/Release-windows-x86_64/shader-tools.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}
      - name: Build authored example scripts through the public command
        run: python scripts/hazel.py script-build examples/SceneTransitions/SceneTransitions.hproj --config Release
      - name: Construct complete Release distributions
        run: python scripts/hazel.py package
      - name: Test extracted archives with source resources and SDK unavailable
        run: python scripts/hazel.py test-packages --profile software
      - name: Verify packaged OpenGL 4.1 path
        run: python scripts/hazel.py test-packages --profile gl41
      - name: Upload verified Windows application archives
        uses: actions/upload-artifact@v4
        with:
          name: Hazel-Windows-x64-Release-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Build both authored games in Debug and Release
        run: |
          foreach ($configuration in @('Debug', 'Release')) {
            foreach ($game in @('MeadowRun', 'Skybound')) {
              python scripts/hazel.py script-build "examples/$game/$game.hproj" --config $configuration
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Windows Debug ownership, authoring, rendering and runtime regressions
        run: python scripts/hazel.py test --config Debug --profile software
      - name: Windows Release regressions
        run: python scripts/hazel.py test --config Release --profile software
      - name: Windows authored game workflows and gameplay invariants
        run: |
          python scripts/hazel.py test-games --config Debug --profile software
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/hazel.py test-games --config Release --profile software
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Construct complete Windows game archives
        run: |
          foreach ($game in @('MeadowRun', 'Skybound')) {
            python scripts/hazel.py package --app Nutella --project "examples/$game/$game.hproj" --name $game --output dist/games
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Windows extracted game acceptance
        run: |
          python scripts/hazel.py test-games --config Release --packages --profile software
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/hazel.py test-games --config Release --packages --profile gl41
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: MeadowRun-Windows-x64-Release-${{ github.sha }}
          path: dist/games/MeadowRun-windows-x86_64-Release.zip*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Skybound-Windows-x64-Release-${{ github.sha }}
          path: dist/games/Skybound-windows-x86_64-Release.zip*
          if-no-files-found: error
      - name: Preserve separate testing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-testing-evidence
          path: |
            build/testing/logs/
            build/testing/packages/
            build/testing/games/
            build/testing/windows-mesa/readme*
            build/testing/windows-mesa/license*
          if-no-files-found: ignore
  linux-build:
    name: Linux Debug, Release and extracted binaries (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install explicit CI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-pip pkg-config mono-devel uuid-dev libgtk-3-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libxtst6 xvfb xauth
      - name: Cache pinned project-owned dependencies
        uses: actions/cache/restore@v4
        id: shader-cache
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          restore-keys: nutella-ubuntu24-gcc13-
          key: nutella-ubuntu24-gcc13-${{ hashFiles('scripts/dependencies/build-shader-tools.py', 'scripts/dependencies/shader-workspace.lua', 'scripts/dependencies/generate-shader-inputs.py', 'scripts/dependencies/shader-sources.json', 'scripts/dependencies/shader-tools.json', 'scripts/dependencies/shader-tools-compat.h', 'scripts/internal/toolchain.json') }}
      - name: Setup and build Debug (two jobs)
        run: scripts/setup.sh --tests
      - name: Build Release (two jobs, after Debug)
        run: python3 scripts/hazel.py build --config Release --tests
      - name: Cache completed pinned SDKs independently of application tests
        if: always() && steps.shader-cache.outputs.cache-hit != 'true' && hashFiles('build/dependencies/install/Debug-linux-x86_64/shader-tools.json') != '' && hashFiles('build/dependencies/install/Release-linux-x86_64/shader-tools.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/dependencies/install
            build/tools/premake-core
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}
      - name: Build authored example scripts through the public command
        run: python3 scripts/hazel.py script-build examples/SceneTransitions/SceneTransitions.hproj --config Release
      - name: Build both authored games in Debug and Release
        run: |
          for configuration in Debug Release; do
            for game in MeadowRun Skybound; do
              python3 scripts/hazel.py script-build "examples/$game/$game.hproj" --config "$configuration"
            done
          done
      - name: Linux Debug regressions
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/hazel.py test --config Debug --profile software
      - name: Linux Release regressions
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/hazel.py test --config Release --profile software
      - name: Construct complete Release distributions
        run: python3 scripts/hazel.py package
      - name: Test extracted archives with source resources and SDK unavailable
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/hazel.py test-packages --profile software
      - name: Verify packaged OpenGL 4.1 path
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/hazel.py test-packages --profile gl41
      - name: Upload verified Linux application archives
        uses: actions/upload-artifact@v4
        with:
          name: Hazel-Linux-x86_64-Release-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Linux authored game workflows and gameplay invariants
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/hazel.py test-games --config Debug --profile software
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/hazel.py test-games --config Release --profile software
      - name: Construct complete Linux game archives
        run: |
          for game in MeadowRun Skybound; do
            python3 scripts/hazel.py package --app Nutella --project "examples/$game/$game.hproj" --name "$game" --output dist/games
          done
      - name: Linux extracted game acceptance
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/hazel.py test-games --config Release --packages --profile software
          xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/hazel.py test-games --config Release --packages --profile gl41
      - uses: actions/upload-artifact@v4
        with:
          name: MeadowRun-Linux-x86_64-Release-${{ github.sha }}
          path: dist/games/MeadowRun-linux-x86_64-Release.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Skybound-Linux-x86_64-Release-${{ github.sha }}
          path: dist/games/Skybound-linux-x86_64-Release.tar.gz*
          if-no-files-found: error
      - name: Preserve separate testing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-testing-evidence
          path: |
            build/testing/logs/
            build/testing/packages/
            build/testing/games/
          if-no-files-found: ignore
