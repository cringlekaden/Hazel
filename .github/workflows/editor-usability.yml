name: Editor usability checks
'on':
  push:
    branches:
    - feature/editor-usability
  pull_request:
    paths:
    - Hazelnut/**
    - Hazel/src/**
    - tests/migration/**
    - .github/workflows/editor-usability.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  linux-editor:
    name: Linux Debug / Release, bounded editor checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install explicit CI prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3 python3-pip pkg-config mono-devel uuid-dev libgtk-3-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libxtst6 xvfb xauth
    - name: Cache pinned project-owned dependencies
      uses: actions/cache/restore@v4
      id: shader-cache
      with:
        path: |
          build/dependencies/install
          build/tools/premake-core
        restore-keys: nutella-ubuntu24-gcc13-
        key: nutella-ubuntu24-gcc13-${{ hashFiles('scripts/dependencies/build-shader-tools.py', 'scripts/dependencies/shader-workspace.lua', 'scripts/dependencies/generate-shader-inputs.py', 'scripts/dependencies/shader-sources.json', 'scripts/dependencies/shader-tools.json', 'scripts/dependencies/shader-tools-compat.h',
          'scripts/internal/toolchain.json') }}
    - name: Setup and build Debug (two jobs)
      run: scripts/setup.sh --tests
    - name: Build Release (two jobs, after Debug)
      run: python3 scripts/hazel.py build --config Release --tests
    - name: Cache completed pinned SDKs independently of application tests
      if: always() && steps.shader-cache.outputs.cache-hit != 'true' && hashFiles('build/dependencies/install/Debug-linux-x86_64/shader-tools.json') != '' && hashFiles('build/dependencies/install/Release-linux-x86_64/shader-tools.json') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          build/dependencies/install
          build/tools/premake-core
        key: ${{ steps.shader-cache.outputs.cache-primary-key }}
    - name: Debug bounded ownership, authoring and startup regressions (software)
      run: xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test --config Debug --profile software
    - name: Release bounded ownership, authoring and startup regressions (gl41)
      run: xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' python3 scripts/hazel.py test --config Release --profile gl41
    - name: Preserve regression evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-editor-usability-evidence
        path: build/testing/logs/
        if-no-files-found: ignore
  windows-editor:
    name: Windows Debug / Release, bounded editor checks
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Cache pinned project-owned dependencies
      uses: actions/cache/restore@v4
      id: shader-cache
      with:
        path: |
          build/dependencies/install
          build/tools/premake-core
        restore-keys: nutella-windows2022-
        key: nutella-windows2022-${{ hashFiles('scripts/dependencies/build-shader-tools.py', 'scripts/dependencies/shader-workspace.lua', 'scripts/dependencies/generate-shader-inputs.py', 'scripts/dependencies/shader-sources.json', 'scripts/dependencies/shader-tools.json', 'scripts/dependencies/shader-tools-compat.h',
          'scripts/internal/toolchain.json') }}
    - name: Setup and build Debug (two jobs)
      run: ./scripts/setup.ps1 --tests
    - name: Build Release (two jobs, after Debug)
      run: python scripts/hazel.py build --config Release --tests
    - name: Cache completed pinned SDKs independently of application tests
      if: always() && steps.shader-cache.outputs.cache-hit != 'true' && hashFiles('build/dependencies/install/Debug-windows-x86_64/shader-tools.json') != '' && hashFiles('build/dependencies/install/Release-windows-x86_64/shader-tools.json') != ''
      uses: actions/cache/save@v4
      with:
        path: |
          build/dependencies/install
          build/tools/premake-core
        key: ${{ steps.shader-cache.outputs.cache-primary-key }}
    - name: Debug bounded ownership, authoring and startup regressions (software)
      run: python scripts/hazel.py test --config Debug --profile software
    - name: Release bounded ownership, authoring and startup regressions (gl41)
      run: python scripts/hazel.py test --config Release --profile gl41
    - name: Preserve regression evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-editor-usability-evidence
        path: build/testing/logs/
        if-no-files-found: ignore
